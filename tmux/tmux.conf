# ── Prefix ────────────────────────────────────────────────

unbind C-b
set -g prefix C-a
bind a   send-prefix
bind C-a last-window

# ── Terminal ──────────────────────────────────────────────

set -g  default-terminal  "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:extkeys"
set -s  extended-keys     on
set -s  escape-time       10
set -g  focus-events      on
set -g  allow-passthrough on
set -g  set-clipboard     on
set -g  set-titles        on
set -g  set-titles-string "#S / #W"

# ── General ───────────────────────────────────────────────

set -g mouse            on
set -g history-limit    50000
set -g display-time     2000
set -g base-index       1
set -g pane-base-index  1
set -g renumber-windows on

# ── Windows & panes ───────────────────────────────────────

unbind '"'
unbind %
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

bind s choose-tree -Zs
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# ── Copy mode ─────────────────────────────────────────────

set -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel

# ── Theme (Catppuccin Mocha) ──────────────────────────────

set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style            "bg=#313244,fg=#cdd6f4"
set -g message-command-style    "bg=#313244,fg=#cdd6f4"
set -g mode-style               "bg=#45475a,fg=#cdd6f4"
set -g clock-mode-colour        "#89b4fa"

# ── Status bar ────────────────────────────────────────────

set -g status-position top
set -g status-style    "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 30
set -g status-left  "#{?client_prefix,#[bg=#f38ba8],#{?pane_in_mode,#[bg=#f9e2af],#[bg=#89b4fa]}}#[fg=#1e1e2e]  #S  #[default] "
set -g status-right "#[bg=#313244,fg=#89b4fa]   #{client_user}   #[bg=#89b4fa,fg=#1e1e2e]   #h   "

set -g window-status-separator      " "
set -g window-status-format         "#[bg=#45475a,fg=#cdd6f4]   #I #{pane_current_command}#{?window_zoomed_flag, 󰊓,}    "
set -g window-status-current-format "#[bg=#a6e3a1,fg=#1e1e2e]   #I #{pane_current_command}#{?window_zoomed_flag, 󰊓,}    "
